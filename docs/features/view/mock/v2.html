<style>
/* light: minimalist-ui warm monochrome. dark: Paradev ember. */
:root {

  --line: #EAEAEA; --line-2: #DCDAD5; --edge: #C3C0BA;

  --hover: rgba(17, 17, 17, .04); --sel: rgba(17, 17, 17, .065);
  --accent: #B0532A; --accent-deep: #7E3A1C; --accent-bg: #FCEEE7; --accent-line: #E8BFA9; --on-accent: #FFFFFF;

  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Charter, Georgia, serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151110; --col: #1A1716; --rail: #120F0E; --card: #1E1B1A; --sunk: #171413; --code: #1A1716;
    --line: #2A2827; --line-2: #3A3837; --edge: #57524E;

    --fail: #E5807A; --fail-bg: rgba(229, 128, 122, .12); --fail-line: rgba(229, 128, 122, .45);
    --warn: #E5C07B; --warn-bg: rgba(229, 192, 123, .12); --warn-line: rgba(229, 192, 123, .4);
    --pause: #8F8B88; --pause-bg: rgba(143, 139, 136, .14);
    --btn: #EAE8E6; --btn-fg: #151110; --btn-hover: #FFFFFF;
    --dot: rgba(234, 232, 230, .06);
    --toast-bg: #EAE8E6; --toast-fg: #151110;
  }
}

  color-scheme: dark;
  --bg: #151110; --col: #1A1716; --rail: #120F0E; --card: #1E1B1A; --sunk: #171413; --code: #1A1716;
  --line: #2A2827; --line-2: #3A3837; --edge: #57524E;

  --toast-bg: #EAE8E6; --toast-fg: #151110;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }
p { margin: 0; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.faint { color: var(--faint); }
.muted { color: var(--muted); }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.app { display: grid; grid-template-columns: 52px 280px minmax(0, 1fr); height: 100vh; }

/* marks */
.mark { width: 14px; height: 14px; flex: none; display: block; }
.spin { animation: spin 1.1s linear infinite; }
.pulse circle:first-child { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .35; } }

/* rail */
#rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0 16px; gap: 4px; }
.brand { width: 24px; height: 24px; margin-bottom: 16px; }
.brand svg { width: 24px; height: 24px; display: block; }
.rail-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); position: relative; transition: background .15s, color .15s; }
.rail-btn svg { width: 19px; height: 19px; }
.rail-btn:hover { background: var(--hover); color: var(--strong); }
.rail-btn.on { background: var(--sel); color: var(--strong); }
.rail-btn .count { position: absolute; top: 1px; right: 0; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 9.5px; font-weight: 700; line-height: 15px; text-align: center; }
.spacer { flex: 1; }
.service { width: 8px; height: 8px; border-radius: 50%; background: var(--done); margin-top: 12px; box-shadow: 0 0 0 3px var(--done-bg); }

/* column */
#col { background: var(--col); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#col-top { padding: 12px 10px 4px; display: flex; flex-direction: column; gap: 1px; }
.col-row { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--text); font-weight: 500; font-size: 13px; width: 100%; }
.col-row:hover { background: var(--hover); }
.col-row.on { background: var(--sel); }
.boxplus { width: 18px; height: 18px; border: 1px solid var(--line-2); border-radius: 5px; display: grid; place-items: center; background: var(--card); color: var(--muted); flex: none; }
.boxplus svg { width: 11px; height: 11px; }
.search { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--muted); cursor: text; }
.search:hover { background: var(--hover); }
.search:focus-within { background: var(--card); box-shadow: inset 0 0 0 1px var(--line-2); }
.search > svg { width: 15px; height: 15px; flex: none; margin: 0 1px 0 2px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13px; color: var(--text); padding: 0; }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--faint); }
.search .clear:hover { color: var(--strong); background: var(--sel); }
.search .clear svg { width: 11px; height: 11px; }
kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-bottom-width: 1.5px; border-radius: 4px; padding: 0 5px; background: var(--card); color: var(--muted); line-height: 16px; }
.scope { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; font-size: 12.5px; color: var(--muted); }
.scope select { margin-left: auto; border: 1px solid var(--line-2); background: var(--card); border-radius: 6px; height: 24px; padding: 0 6px; font-size: 12px; color: var(--text); }
#col-body { flex: 1; overflow: auto; padding: 2px 10px 48px; }
.sec { margin-top: 12px; }
.sec-h { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.sec-h .n { font-weight: 500; letter-spacing: 0; }
.sec-h .r { margin-left: auto; display: flex; align-items: center; gap: 2px; text-transform: none; letter-spacing: 0; }
.sec-h .path { font-family: var(--mono); font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 10.5px; }
.minis button { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; color: var(--faint); font-weight: 650; }
.minis button:hover { color: var(--text); }
.minis button.on { color: var(--text); background: var(--sel); }
.it-wrap { position: relative; }
.it { display: flex; align-items: center; gap: 9px; min-height: 30px; padding: 5px 8px; border-radius: 7px; color: var(--text); }
.it:hover { background: var(--hover); }
.it.on { background: var(--sel); }
.it .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.it .l1 { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it.two .l1 { font-weight: 500; }
.it .l2 { font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .l2 .needs { color: var(--accent); }
.it .l2 .bad { color: var(--fail); }
.it.two { align-items: flex-start; padding: 6px 8px; }
.it.two > .mark, .it.two > .ico { margin-top: 3px; }
.it .side { flex: none; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.it .ico { width: 14px; height: 14px; color: var(--faint); flex: none; }
.it .ico svg { width: 14px; height: 14px; display: block; }
.it .tag { flex: none; font-size: 10px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--accent-bg); color: var(--accent); }
.it .tag.bad { background: var(--fail-bg); color: var(--fail); }
.it .tag.quiet { background: var(--sel); color: var(--muted); }
.it-x { position: absolute; right: 6px; top: 7px; width: 22px; height: 22px; border-radius: 5px; display: none; place-items: center; color: var(--muted); }
.it-x svg { width: 12px; height: 12px; }
.it-x:hover { background: var(--sel); color: var(--strong); }
.it-wrap:hover .it-x, .it-wrap:focus-within .it-x { display: grid; }
.it-wrap:hover .side, .it-wrap:focus-within .side { visibility: hidden; }
.it-wrap:hover .it { background: var(--hover); }
.it-wrap:hover .it.on { background: var(--sel); }
.col-foot { padding: 8px 8px 0; font-size: 11.5px; color: var(--faint); }
.empty { padding: 18px 8px; color: var(--faint); font-size: 12.5px; }
mark { background: var(--warn-bg); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: inset 0 -1px 0 var(--warn-line); }

/* main */
#main { overflow: auto; min-width: 0; position: relative; }
.page { max-width: 1280px; margin: 0 auto; padding: 24px 40px 88px; }
.page.enter { animation: enter .5s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
.crumbs { font-size: 12.5px; color: var(--faint); display: flex; gap: 7px; align-items: center; min-height: 20px; }
.crumbs a:hover { color: var(--text); }
.head { display: flex; align-items: flex-start; gap: 24px; margin-top: 12px; }
.head .grow { flex: 1; min-width: 0; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: -.02em; color: var(--strong); margin: 0; }
.desc { margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 72ch; }
.actions { display: flex; gap: 8px; flex: none; padding-top: 3px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.meta a { color: var(--text); }
.meta a:hover { text-decoration: underline; text-underline-offset: 2px; }
.meta .mono { font-size: 11.5px; }
.meta details { position: relative; }
.meta summary { cursor: pointer; list-style: none; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.meta summary::-webkit-details-marker { display: none; }
.meta summary:hover { color: var(--strong); }
.meta summary svg { width: 11px; height: 11px; transition: transform .15s; }
.meta details[open] summary svg { transform: rotate(90deg); }
.dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 16px; margin-top: 12px; padding: 14px 16px; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; font-size: 12.5px; }
.dl dt { color: var(--faint); }
.dl dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }

/* pills, chips */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 9px 0 7px; border-radius: 999px; font-size: 10.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; background: var(--pause-bg); color: var(--muted); white-space: nowrap; }
.pill .mark { width: 11px; height: 11px; }
.pill.run { background: var(--run-bg); color: var(--run); }
.pill.done { background: var(--done-bg); color: var(--done); }
.pill.fail { background: var(--fail-bg); color: var(--fail); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.needs { background: var(--accent-bg); color: var(--accent); }
.pill.plain { padding: 0 9px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--text); background: var(--card); white-space: nowrap; }
a.chip:hover { border-color: var(--edge); }
.chip svg { width: 12px; height: 12px; color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.tiny { font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--card); color: var(--text); font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--edge); }
.btn:active { transform: scale(.98); }
.btn svg { width: 13px; height: 13px; flex: none; }
.btn.primary { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.btn.primary:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.accent:hover { filter: brightness(1.06); }
.btn.danger { color: var(--fail); }
.btn.danger.arm { background: var(--fail); color: var(--card); border-color: var(--fail); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.ghost:hover { color: var(--strong); background: var(--hover); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.linkbtn { color: var(--muted); font-size: 12px; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.linkbtn:hover { color: var(--strong); text-decoration-color: currentColor; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--sunk); border: 1px solid var(--line); flex: none; }
.seg button { height: 22px; padding: 0 9px; border-radius: 5px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.seg button:hover { color: var(--strong); }
.seg button.on { background: var(--card); color: var(--strong); box-shadow: 0 0 0 1px var(--line-2); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); }
button.card-h { width: 100%; text-align: left; }
button.card-h:hover .ttl { text-decoration: underline; text-underline-offset: 2px; }
.card-h > svg { width: 14px; height: 14px; color: var(--faint); flex: none; }
.card-h .ttl { font-size: 13px; font-weight: 600; color: var(--strong); }
.card-h .sub { font-size: 12px; color: var(--faint); }
.card-h .r { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); }
.card-b { padding: 16px; }
.card-f { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-top: 20px; align-items: start; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.lbl { font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.chips + .lbl, .hint + .lbl, p + .lbl { margin-top: 18px; }
.g-seq > .g-item.g-par:last-child > .g-br > .g-tail { visibility: hidden; }
.g-seq > .g-item.g-par:last-child > .g-br::after { display: none; }
.rows > * + * { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 16px; font-size: 12.5px; min-width: 0; }
a.row:hover { background: var(--hover); }
.row .grow { flex: 1; min-width: 0; }
.row .r { flex: none; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.row .d { color: var(--muted); font-size: 12px; }
.row b { font-weight: 550; color: var(--strong); }

/* notes */
.note { display: flex; gap: 10px; padding: 10px 14px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); font-size: 12.5px; color: var(--text); }
.note + .note { margin-top: 8px; }
.note > svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--muted); }
.note.bad { background: var(--fail-bg); border-color: var(--fail-line); }
.note.bad > svg { color: var(--fail); }
.note.warn { background: var(--warn-bg); border-color: var(--warn-line); }
.note.warn > svg { color: var(--warn); }
.note.good > svg { color: var(--done); }
.note .t { font-weight: 600; color: var(--strong); }
.note .grow { flex: 1; min-width: 0; }
.note .acts { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-weight: 500; color: var(--faint); font-size: 11.5px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* needs-you card */
.ask { margin-top: 20px; border: 1px solid var(--accent-line); background: var(--card); border-radius: 10px; overflow: hidden; }
.ask-top { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--accent-bg); color: var(--accent); font-size: 12px; }
.ask-top .what { text-transform: uppercase; letter-spacing: .07em; font-size: 10.5px; font-weight: 700; }
.ask-top .where { color: var(--text); }
.ask-top .when { margin-left: auto; color: var(--muted); }
.ask-b { padding: 16px 18px 18px; }
.ask-q { font-size: 16px; color: var(--strong); margin: 0 0 12px; font-weight: 500; line-height: 1.45; }
.ask-list { margin: 0 0 14px; padding: 0; list-style: none; border: 1px solid var(--line); border-radius: 8px; }
.ask-list li { padding: 7px 12px; font-size: 12.5px; display: flex; gap: 10px; }
.ask-list li + li { border-top: 1px solid var(--line); }
.ask-list .k { font-family: var(--mono); font-size: 12px; color: var(--strong); flex: none; }
.ask-list li.out { color: var(--faint); }
.ask-detail { color: var(--muted); font-size: 12.5px; margin: -4px 0 14px; }
.ask-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask-controls .hint { margin-left: auto; }
.choice { height: 32px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); font-weight: 500; font-size: 13px; transition: border-color .15s, color .15s, transform .1s; }
.choice:hover { border-color: var(--accent); color: var(--accent); }
.choice:active { transform: scale(.98); }
.hint { color: var(--faint); font-size: 12px; }
.ask.fail { border-color: var(--fail-line); }
.ask.fail .ask-top { background: var(--fail-bg); color: var(--fail); }
.ask.quiet { border-color: var(--line); }
.ask.quiet .ask-top { background: var(--sunk); color: var(--muted); }
.ask.quiet .ask-q { font-size: 13.5px; font-weight: 400; color: var(--text); margin: 0; }
.field { display: flex; gap: 8px; flex: 1; min-width: 260px; }
.shown { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px; overflow: hidden; }
.shown-h { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); font-size: 11.5px; color: var(--faint); }
.shown-h .seg { margin-left: auto; }
.shown .md { padding: 14px 16px 6px; max-height: 300px; overflow: auto; }
.shown .codeblock { border: 0; border-radius: 0; }
.errbox { font-family: var(--mono); font-size: 12px; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; color: var(--fail); margin: 0 0 14px; }
.result { margin-top: 20px; display: flex; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); }
.result .k { flex: none; width: 90px; color: var(--faint); font-size: 12px; padding-top: 1px; }
.result .v { color: var(--strong); }

/* inputs */
.input { width: 100%; height: 32px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--card); padding: 0 10px; outline: none; font-size: 13px; transition: border-color .15s, box-shadow .15s; }
textarea.input { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
select.input { padding: 0 6px; }
.input:focus { border-color: var(--edge); box-shadow: 0 0 0 3px var(--sel); }

/* run body */
.runbody { display: grid; grid-template-columns: minmax(420px, 1.1fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; height: max(540px, calc(100vh - 250px)); }
.runbody > .card { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .mark { width: 12px; height: 12px; }

/* graph */
.g-canvas { flex: 1; min-height: 0; overflow: auto; background-color: var(--sunk); background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 18px 18px; position: relative; }
.g-root { width: max-content; min-width: 100%; padding: 28px 44px 48px; display: flex; justify-content: center; }
.g-seq { display: flex; flex-direction: column; align-items: center; }
.g-item { position: relative; }
.g-seq > .g-item + .g-item { margin-top: 26px; }
.g-seq > .g-item + .g-item::before { content: ""; position: absolute; left: calc(50% - .75px); top: -26px; height: 21px; width: 1.5px; background: var(--edge); }
.g-seq > .g-item + .g-item::after { content: ""; position: absolute; left: calc(50% - 4px); top: -6px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--edge); }
.g-seq > .g-item.fut + .g-item::before, .g-seq > .g-item.fut::before { background: none; border-left: 1.5px dashed var(--edge); width: 0; }
.g-seq > .g-item.g-par::after { display: none; }
.g-seq > .g-item.g-par::before { height: 26px; }
.g-node { width: var(--nw, 232px); background: var(--card); border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 11px; cursor: pointer; display: block; transition: border-color .15s, box-shadow .15s, opacity .15s; }
.g-node:hover { border-color: var(--edge); }
.g-node.on { outline: 2px solid var(--strong); outline-offset: 2px; }
.g-n1 { display: flex; align-items: center; gap: 7px; }
.g-ic { width: 14px; height: 14px; color: var(--muted); flex: none; display: grid; place-items: center; }
.g-ic svg { width: 14px; height: 14px; }
.g-lb { flex: 1; min-width: 0; font-weight: 600; font-size: 12.5px; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-n2 { display: flex; gap: 8px; margin-top: 2px; padding-left: 21px; font-size: 11.5px; color: var(--faint); }
.g-n2 .m { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-n2 .num { flex: none; font-variant-numeric: tabular-nums; }
.g-n2 .exit { color: var(--warn); }
.g-n3 { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; padding-left: 21px; }
.g-opt { font-size: 10.5px; padding: 0 6px; border-radius: 4px; border: 1px dashed var(--line-2); color: var(--faint); font-family: var(--mono); line-height: 17px; }
.g-opt.on { border-style: solid; border-color: var(--strong); color: var(--strong); }
.g-node.s-running { border-color: var(--run-line); box-shadow: 0 0 0 3px var(--run-bg); }
.g-node.s-waiting { border-color: var(--accent-line); background: var(--accent-bg); }
.g-node.s-failed { border-color: var(--fail-line); background: var(--fail-bg); }
.g-node.s-paused { background: var(--pause-bg); }
.g-node.s-pending, .g-node.s-skipped, .g-node.fut { border-style: dashed; opacity: .62; }
.g-node.s-pending:hover, .g-node.s-skipped:hover { opacity: .85; }
.g-node.fut { cursor: default; }
.g-node.bad { border-color: var(--fail-line); border-style: solid; }
.g-node .flag { margin-left: auto; flex: none; font-size: 10px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--fail); }
.g-node .flag.new { color: var(--accent); }
.g-frame { border: 1px solid var(--line-2); border-radius: 12px; padding: 0 12px 16px; display: flex; flex-direction: column; align-items: center; position: relative; background: color-mix(in srgb, var(--sunk) 70%, transparent); }
.g-frame.fut { border-style: dashed; }
.g-frame.fut > .g-fh, .g-frame.fut > .g-seq { opacity: .7; }
.g-fh { align-self: stretch; display: flex; align-items: center; gap: 7px; min-height: 34px; font-size: 11.5px; color: var(--muted); margin: 0 -12px 14px; padding: 0 12px; border-bottom: 1px solid var(--line); }
button.g-fh { width: calc(100% + 24px); cursor: pointer; text-align: left; }
button.g-fh:hover .t { text-decoration: underline; text-underline-offset: 2px; }
.g-fh .k { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); flex: none; }
.g-fh .t { color: var(--strong); font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-fh .r { margin-left: auto; color: var(--faint); white-space: nowrap; padding-left: 8px; display: inline-flex; align-items: center; gap: 5px; }
.g-fh .r .mark { width: 12px; height: 12px; }
.g-fh > svg { width: 13px; height: 13px; flex: none; color: var(--faint); }
.g-fh .chev { width: 11px; height: 11px; color: var(--faint); flex: none; transition: transform .15s; }
.g-fh .chev.open { transform: rotate(90deg); }
.g-frame.closed { padding-bottom: 0; }
.g-frame.closed > .g-fh { margin-bottom: 0; border-bottom: 0; }
.g-frame.loop { padding-right: 40px; }
.g-frame.loop > .g-fh { margin-right: -40px; }
button.g-fh.lp { width: calc(100% + 52px); }
.g-back { position: absolute; right: 13px; top: 50px; bottom: 46px; width: 14px; border: 1.5px dashed var(--edge); border-left: 0; border-radius: 0 9px 9px 0; }
.g-back::after { content: ""; position: absolute; left: -2px; top: -5px; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-right: 5px solid var(--edge); }
.g-frame.cond { border-style: dashed; background: none; }
.g-frame.bp { border-color: var(--line-2); }
.g-frame.bp.waiting { border-color: var(--accent-line); background: var(--accent-bg); }
.g-frame.bp.waiting > .g-fh .k, .g-frame.bp.waiting > .g-fh .r { color: var(--accent); }
.g-frame.bp.stopped > .g-fh .r { color: var(--fail); }
.g-frame.nest > .g-fh .k { color: var(--muted); }
.g-ff { align-self: stretch; margin: 14px -12px -16px; padding: 7px 12px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); border-radius: 0 0 12px 12px; }
.g-frame.bp.waiting .g-ff { color: var(--accent); border-color: var(--accent-line); }
.g-frame.on { outline: 2px solid var(--strong); outline-offset: 2px; }
.g-att { display: flex; align-items: center; gap: 7px; align-self: stretch; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 11.5px; color: var(--muted); background: var(--card); margin-bottom: 8px; max-width: 100%; }
button.g-att:hover { border-color: var(--edge); }
.g-att.on { border-color: var(--strong); }
.g-att > svg { width: 12px; height: 12px; flex: none; color: var(--faint); }
.g-att .mark { width: 12px; height: 12px; }
.g-att b { color: var(--text); font-weight: 600; flex: none; }
.g-att .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-att-h { align-self: flex-start; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; font-weight: 650; margin: 4px 0 10px; }
.g-par { display: flex; align-items: stretch; }
.g-br { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 9px; --nw: 196px; }
.g-br::before, .g-br::after { content: ""; position: absolute; left: 0; right: 0; height: 1.5px; background: var(--edge); }
.g-br::before { top: 0; }
.g-br::after { bottom: 0; }
.g-br:first-of-type::before, .g-br:first-of-type::after { left: 50%; }
.g-br:last-of-type::before, .g-br:last-of-type::after { right: 50%; }
.g-br:only-of-type::before, .g-br:only-of-type::after { display: none; }
.g-par.fut .g-br::before, .g-par.fut .g-br::after { background: none; border-top: 1.5px dashed var(--edge); }
.g-stub { width: 1.5px; height: 20px; background: var(--edge); position: relative; flex: none; margin-bottom: 6px; }
.g-stub::after { content: ""; position: absolute; left: -3.25px; bottom: -5px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--edge); }
.g-tail { flex: 1; width: 1.5px; min-height: 18px; background: var(--edge); margin-top: 0; }
.g-par.fut .g-stub, .g-par.fut .g-tail { background: none; border-left: 1.5px dashed var(--edge); width: 0; }
button.g-par-tag:hover, .g-par-tag.on { color: var(--strong); }
.g-par-tag { position: absolute; top: -22px; left: calc(50% + 9px); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.g-chip { margin-bottom: 12px; font-family: var(--mono); font-size: 11px; padding: 1px 8px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--card); color: var(--text); white-space: nowrap; }
.g-br.stack .g-node, .g-br.stack .g-frame { box-shadow: 4px 4px 0 -1px var(--sunk), 4px 4px 0 0 var(--line-2); }
.g-dec { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--card); font-size: 11.5px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.g-dec .q { color: var(--text); }
.g-dec.fut { border-style: dashed; cursor: default; }
div.g-dec { cursor: default; }
button.g-dec:hover { border-color: var(--edge); }
.g-frame.nest { min-width: 240px; }
.g-frame.nest.closed { background: var(--card); }
.g-dec.on { outline: 2px solid var(--strong); outline-offset: 2px; }
.g-arm { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); display: flex; align-items: center; pointer-events: none; }
.g-arm::before { content: ""; width: 26px; border-top: 1.5px dashed var(--edge); }
.g-end { font-size: 10.5px; padding: 2px 8px; border: 1px dashed var(--edge); border-radius: 6px; color: var(--faint); white-space: nowrap; background: var(--sunk); }
.g-dec.went-end .g-arm::before { border-top-style: solid; border-color: var(--strong); }
.g-dec.went-end .g-end { border-style: solid; border-color: var(--strong); color: var(--strong); }
.g-dec.went-on .g-arm { opacity: .45; }
.wfgraph { display: grid; grid-template-columns: minmax(0, 1fr) 340px; margin-top: 16px; height: max(520px, calc(100vh - 300px)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.wfgraph .g-canvas { border-right: 1px solid var(--line); }
.cap { font-size: 12px; color: var(--faint); margin-top: 8px; }
.insp { overflow: auto; padding: 18px 18px 28px; min-height: 0; }
.insp h2 { font-size: 15px; font-weight: 600; color: var(--strong); margin: 4px 0 6px; display: flex; align-items: center; gap: 8px; }
.insp h2 svg { width: 15px; height: 15px; color: var(--muted); }
.insp p { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
.insp .lbl { margin-top: 18px; }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 5px 12px; font-size: 12.5px; }
.kv .k { color: var(--faint); }
.kv .v { min-width: 0; overflow-wrap: anywhere; }
.kv .v.mono { font-size: 11.5px; }

/* feed */
.feed-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 16px; border-bottom: 1px solid var(--line); min-height: 44px; }
.feed-h .t { font-weight: 600; color: var(--strong); }
.feed-h .x { color: var(--faint); font-size: 12px; }
.feed-h .x a { color: var(--muted); }
.feed-h .x a:hover { color: var(--strong); text-decoration: underline; text-underline-offset: 2px; }
.feed-h .r { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.entries { flex: 1; overflow: auto; padding: 8px 0 12px; }
.entry { display: grid; grid-template-columns: 38px 50px minmax(0, 1fr); gap: 0 10px; padding: 5px 16px; font-size: 12.5px; }
.entry .t { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11.5px; padding-top: 1px; }
.entry .kind { color: var(--faint); font-size: 11.5px; padding-top: 1px; }
.entry .body { min-width: 0; overflow-wrap: anywhere; }
.entry.prompt .body { white-space: pre-wrap; color: var(--muted); }
.entry.text .body { color: var(--text); }
.entry.tool { cursor: pointer; }
.entry.tool:hover { background: var(--hover); }
.entry.tool .tn { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--strong); margin-right: 8px; }
.entry.tool .ta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.entry.tool .tr { color: var(--faint); margin-left: 8px; font-size: 12px; }
.entry.tool .res { display: none; margin-top: 6px; padding: 8px 10px; border-radius: 6px; background: var(--code); border: 1px solid var(--line); font-size: 11.5px; white-space: pre-wrap; }
.entry.tool.open .res { display: block; }
.entry.asks { background: var(--accent-bg); }
.entry.asks .kind, .entry.asks .body { color: var(--accent); }
.entry.asks .body { font-weight: 500; }
.entry.tell .who, .entry.answer .who { color: var(--accent); font-weight: 600; margin-right: 6px; }
.entry.tell .dlv { margin-left: 8px; font-size: 11px; color: var(--faint); }
.entry.error .body { color: var(--fail); }
.entry.note .body { color: var(--muted); font-style: italic; }
.entry.command .body, .entry.output .body { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; }
.entry.command .body { color: var(--strong); }
.entry.output .body { color: var(--muted); }
.entry.fresh { animation: fresh .6s ease-out; }
@keyframes fresh { from { opacity: 0; transform: translateY(4px); } }
.feed-empty { padding: 28px 16px; color: var(--faint); font-size: 12.5px; text-align: center; }
.working { display: flex; align-items: center; gap: 8px; padding: 4px 16px 10px 64px; color: var(--faint); font-size: 12px; }
.dots { display: inline-flex; gap: 3px; }
.dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--run); animation: pulse 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
.tellbox { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.tellbox .tf { flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 7px; padding: 0 10px; height: 32px; background: var(--card); min-width: 0; }
.tellbox .tf:focus-within { border-color: var(--edge); box-shadow: 0 0 0 3px var(--sel); }
.tellbox .to { font-size: 12px; color: var(--faint); white-space: nowrap; }
.tellbox input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 12.5px; }

/* code */
.codeblock { border: 1px solid var(--line); border-radius: 10px; background: var(--code); overflow: hidden; font-size: 12px; font-family: var(--mono); }
.codeblock .path { display: flex; justify-content: space-between; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--faint); font-size: 11.5px; }
.codeblock .inner { overflow: auto; padding: 8px 0; max-height: 620px; }
.ln { display: flex; line-height: 1.7; min-width: max-content; }
.ln .no { width: 46px; flex: none; text-align: right; padding-right: 14px; color: var(--faint); user-select: none; }
.ln .tx { white-space: pre; padding-right: 18px; }
.ln.add { background: var(--done-bg); }
.ln.del { background: var(--fail-bg); }
.ln.gap .tx { color: var(--faint); font-style: italic; }
.syn-kw { color: var(--accent-deep); }
:root[data-theme="dark"] .syn-kw { color: #E79A7A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .syn-kw { color: #E79A7A; } }
.syn-fn { color: var(--run); }
.syn-str { color: var(--done); }
.syn-com { color: var(--faint); }
.syn-h { color: var(--strong); font-weight: 700; }
.card > .codeblock { border: 0; border-radius: 0 0 10px 10px; }
.card > .codeblock .inner { max-height: none; }
.codeblock.wrap .ln { min-width: 0; }
.codeblock.wrap .tx { white-space: pre-wrap; overflow-wrap: anywhere; }
.insp .codeblock .inner { max-height: 300px; }

/* markdown */
.md { font-size: 13.5px; line-height: 1.65; color: var(--text); }
.md > :first-child { margin-top: 0; }
.md h1 { font-family: var(--serif); font-size: 21px; font-weight: 400; letter-spacing: -.01em; margin: 4px 0 10px; color: var(--strong); line-height: 1.25; }
.md h2 { font-size: 14px; font-weight: 650; margin: 18px 0 6px; color: var(--strong); }
.md h3 { font-size: 13px; font-weight: 650; margin: 14px 0 4px; color: var(--strong); }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 20px; }
.md li { margin: 3px 0; }
.md li::marker { color: var(--faint); }
.md code { font-family: var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
.md pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; font-size: 12px; margin: 0 0 12px; font-family: var(--mono); }
.md pre code { border: 0; background: none; padding: 0; }
.md b { color: var(--strong); font-weight: 600; }
.fm { border-collapse: collapse; width: 100%; margin: 0 0 18px; font-size: 12.5px; }
.fm th { text-align: left; width: 110px; color: var(--faint); font-weight: 400; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; vertical-align: top; }
.fm td { padding: 6px 0; border-bottom: 1px solid var(--line); }

/* workflow page */
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin-top: 22px; align-items: flex-end; }
.tab { height: 34px; font-size: 13px; color: var(--muted); border-bottom: 1.5px solid transparent; margin-bottom: -1px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.tab svg { width: 14px; height: 14px; }
.tab:hover { color: var(--strong); }
.tab.on { color: var(--strong); border-color: var(--strong); }
.tabs .r { margin-left: auto; padding-bottom: 6px; }

/* agent page */
.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }

.lk.miss { color: var(--faint); }

.lk.hit .p { color: var(--strong); }

.sk .ico { width: 14px; height: 14px; color: var(--faint); margin-top: 2px; flex: none; }
.sk .ico svg { width: 14px; height: 14px; }
.sk .grow { flex: 1; min-width: 0; }
.sk a.nm { font-weight: 600; color: var(--strong); }

function inputDefaults(w) { const o = {}; w.inputs.forEach((x) => { if (x.def != null) o[x.name] = x.def; }); return o; }
function makeRun(sp, live) {
  const w = WF[sp.wf];
  const old = !!(w.approved.changedSince && sp.start < w.approved.editedAt);
  const defs = inputDefaults(w);
  if (old) w.inputs.forEach((x) => { if (x.isNew) delete defs[x.name]; });
  const run = { id: runId(sp.start), wf: sp.wf, project: sp.project, label: sp.label, inputs: Object.assign(defs, sp.inputs), by: sp.by,
    startedAt: sp.start, spec: sp, sim: !live, nid: 0, occ: {}, old, clear: sp.clear, tickets: sp.tickets, pause: sp.pause || null, result: sp.result, place: w.place };
  run.tree = inst(old ? w.approvedGraph : w.graph, run, { wf: sp.wf, path: "", inputs: run.inputs, attempt: 0 });

}

function waitingLeaf(r) { return leaves(r).find((l) => l.status === "waiting"); }

/* routing: #/feature/id/sub */

}

    case "workflows": { const w = WORKFLOWS.find((x) => !x.deleted); return w && w.name; }
    case "agents": return Object.keys(AGENT_DEFS)[0];

}

function route() {

  } else {

      if (sel) history.replaceState(null, "", "#/" + f + "/" + encodeURIComponent(sel));

/* ------------------------------------------------------------------ graph helpers */
const enc = encodeURIComponent;
const chev = (open) => I.chev.replace("<svg ", '<svg class="chev' + (open ? " open" : "") + '" ');
const labelHtml = (s) => esc(s).replace(/\{(\w+)\}/g, "<i>$1</i>");

const nounOf = (over) => over.replace(/^the chosen /, "").replace(/s$/, "");

const notReached = (l) => l.status === "pending" || !!l.unreached;
const orList = (xs) => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " or " + xs[xs.length - 1];

function anyLeaf(nodes, f) { let hit = false; walkInst(nodes, (n) => { if (!hit && n.t === "leaf" && f(n)) hit = true; }); return hit; }

/* ------------------------------------------------------------------ graph of a run */

  });
  const r = curRun();
  if (changed.length && (!r || changed.includes(r.id))) refreshMain();
  else if (changed.length) { const cs = $("#col-body").scrollTop; renderRail(); renderColBody(); $("#col-body").scrollTop = cs; }
  else if (r && r.status === "running") { const el = $('[data-el="' + r.id + '"]'); if (el) el.textContent = fmtDur(runElapsed(r)); }
}

/* ------------------------------------------------------------------ actions */
function doAction(act) {
  const r = curRun(), now = Date.now();
  switch (act) {
    case "meta": state.metaOpen = !state.metaOpen; return refreshMain();
    case "lookup": { const k = "lookup:" + state.sel.agents; state.open[k] = !state.open[k]; return refreshMain(); }
    case "answer": {
      const l = r && waitingLeaf(r), v = val("ans");
      if (!l) return;
      if (!v) return $("#ans").focus();
      l.acts.push(Object.assign(ANS(v), { at: now }));
      l.status = "running"; l.live = l.live || "generic"; l.ticksLeft = 5; l.poolI = l.poolI || 0;
      advance(r); refreshMain({ feedBottom: true });
      return toast("Sent your answer to " + esc(l.label) + ".", "sous answer " + qidOf(l) + " " + quote(v));
    }
    case "approve": {
      const bp = r && waitingBp(r);
      if (!bp) return;
      bp.state = "approved"; bp.waited = now - bp.reachedAt;
      advance(r); refreshMain({ center: true });
      return toast("Approved. The run goes on.", "sous approve " + qidOf(bp));
    }
    case "sendback": state.sendBack = true; refreshMain(); { const x = $("#sb-note"); if (x) x.focus(); } return;
    case "sendback-cancel": state.sendBack = false; return refreshMain();
    case "sendback-go": {
      const bp = r && waitingBp(r), note = val("sb-note");
      if (!bp) return;
      if (!note) return $("#sb-note").focus();
      const inner = leavesOf(bp.nodes).filter((x) => x.status === "done").pop() || {};
      bp.show = (bp.show || inner.outText || inner.last || "").replace(/\n+$/, "") + "\n\n**Changed after your note.** " + note;
      bp.tries++; bp.state = "pending"; bp.reachedAt = null;
      leavesOf(bp.nodes).forEach((x) => { x.status = "pending"; x.sendNote = "Sent back by you: " + note; x.outText = ""; });
      state.sendBack = false;
      advance(r); refreshMain({ center: true, feedBottom: true });
      return toast("Sent back. " + esc(inner.label || "The step") + " reruns with your note.", "sous send-back " + qidOf(bp) + " " + quote(note));
    }
    case "stop": {
      if (!r) return;
      if (!(state.arm === r.id && now < state.armUntil)) {
        state.arm = r.id; state.armUntil = now + 3000; refreshMain();
        setTimeout(() => { if (state.arm === r.id && Date.now() >= state.armUntil) { state.arm = null; refreshMain(); } }, 3100);
        return;
      }
      state.arm = null;
      walkInst(r.tree, (n) => { if (n.t === "bp" && n.state === "waiting") { n.state = "stopped"; n.waited = now - n.reachedAt; } });
      r.status = "stopped"; r.endedAt = now; r.pause = null; r.result = "You stopped it from this view.";
      finalize(r); refreshMain();
      return toast("Stopped " + esc(r.label) + ".", "sous stop " + r.id);
    }
    case "pause":
      if (!r) return;
      r.status = "paused"; r.pause = { reason: "requested" }; r.lastAt = now;
      refreshMain();
      return toast("Paused. The running steps finish, and nothing new starts.", "sous pause " + r.id);
    case "resume": {
      if (!r) return;
      const note = val("resume-note");
      eachLeaf(r, (l) => { if (l.status === "failed" || l.status === "paused") { l.status = "pending"; l.sendNote = note ? "Note from you: " + note : null; l.exit = 0; } });
      r.pause = null; r.error = null; r.status = "running";
      advance(r); refreshMain({ center: true, feedBottom: true });
      return toast("Resumed.", "sous resume " + r.id + (note ? " --note " + quote(note) : ""));
    }
    case "tell": {
      const l = r && selLeaf(r), msg = val("tell");
      if (!l || !msg) return;
      const a = Object.assign(TELL(msg), { at: now, dlv: "pending" });
      l.acts.push(a); $("#tell").value = "";
      refreshMain({ feedBottom: true });
      setTimeout(() => { a.dlv = "delivered"; refreshMain(); }, 1300);
      setTimeout(() => { if (l.status === "running") { l.acts.push(Object.assign(X("Noted. I'll take that into account for the rest of the step."), { at: Date.now() })); refreshMain(); } }, 3200);
      return toast("Sent to " + esc(l.label) + ". It reads it after its current tool call.", "sous tell " + r.id + " --step " + quote(l.label) + " " + quote(msg));
    }
    case "again": {
      if (!r) return;
      state.startInputs[r.wf] = Object.fromEntries(Object.entries(r.inputs).map(([k, v]) => [k, String(v)]));
      state.startProject = r.project;
      return go("runs/new/" + r.wf);
    }
    case "start": return doStart();
  }
}
function doChoice(c) {
  const r = curRun(), l = r && waitingLeaf(r), now = Date.now();
  if (!l) return;
  l.answer = c; l.status = "done"; l.dur = now - l.startedAt;
  l.acts.push(Object.assign(ANS(c), { at: now }));
  advance(r); refreshMain({ center: true });
  toast("Answered " + esc(c) + ".", "sous answer " + qidOf(l) + " " + quote(c));
}
function deleteRun(id) {
  const r = RUNS.find((x) => x.id === id);
  if (!r) return;
  r.deleted = true;
  route();
  toast("Removed " + esc(r.label) + " from the list.", "sous forget " + id, { hint: "Not a command yet. sous has only sous prune --days N.", undo: () => { r.deleted = false; go("runs/" + id); } });
}
function deleteWf(name) {
  const w = WF[name];
  if (!w) return;
  w.deleted = true;
  if (state.startWf === name) state.startWf = fallback("workflows");
  route();
  toast("Deleted " + esc(name) + ".js. Past runs stay in the list.", "rm " + w.path, { hint: "A real rm has no undo.", undo: () => { w.deleted = false; go("workflows/" + enc(name)); } });
}
function updateStart() {
  const w = WF[state.startWf], st = startState(w);
  const c = $("#start-cmd"); if (c) c.innerHTML = startCmd(w);
  const b = $("#start-go"); if (b) b.disabled = !st.ok;
  const y = $("#start-why"); if (y) { y.textContent = st.why; y.classList.toggle("bad", !!st.bad); }
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a, [data-tool]");
  if (!t) return;
  const d = t.dataset;
  if (t.id === "theme") { state.theme = THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]; store.set("theme", state.theme); applyTheme(); renderRail(); return; }
  if (t.id === "undo") { const f = undoFn; undoFn = null; $("#toast").classList.remove("show"); if (f) f(); return; }
  if (d.go) return go(d.go);
  if (d.delRun) { e.preventDefault(); return deleteRun(d.delRun); }
  if (d.delWf) { e.preventDefault(); return deleteWf(d.delWf); }
  if (d.clearQ !== undefined) { state.q = ""; renderColTop(); renderColBody(); $("#q").focus(); return; }
  if (d.leaf) { const r = curRun(); if (!r) return; state.stepSel[r.id] = d.leaf; return refreshMain({ feedBottom: true }); }
  if (d.nest) { state.open["nest:" + d.nest] = t.getAttribute("aria-expanded") !== "true"; return refreshMain(); }
  if (d.snode) {
    const w = state.sel.workflows, cur = state.wfSel[w];
    state.wfSel[w] = cur === d.snode ? null : d.snode;
    history.replaceState(null, "", "#/workflows/" + enc(w) + (state.wfSel[w] ? "/" + enc(state.wfSel[w]) : ""));
    return refreshMain();
  }
  if (d.mdview) { const [k, v] = d.mdview.split("|"); state.mdView[k] = v; return refreshMain(); }
  if (d.wftab) { const w = state.sel.workflows; state.wfTab[w] = d.wftab; if (d.fileview) state.fileView[w] = d.fileview; return refreshMain(); }
  if (d.fileview) { state.fileView[state.sel.workflows] = d.fileview; return refreshMain(); }
  if (d.group) { state.groupBy = d.group; store.set("groupBy", d.group); return renderColBody(); }
  if (d.pick) { state.startWf = d.pick; return go("runs/new/" + d.pick); }
  if (d.peek) { state.peek = state.peek === d.peek ? null : d.peek; return refreshMain(); }
  if (d.tool) { const k = "tool:" + d.tool; state.open[k] = !state.open[k]; t.classList.toggle("open", state.open[k]); t.setAttribute("aria-expanded", state.open[k]); return; }
  if (d.choice) return doChoice(d.choice);
  if (d.act) { if (!t.disabled) doAction(d.act); }
});
document.addEventListener("keydown", (e) => {
  const a = document.activeElement, typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT");
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape" && a && a.id === "q") { state.q = ""; a.value = ""; renderColBody(); $("#q-end").innerHTML = qEnd(); a.blur(); return; }
  if (e.key === "Enter" && a && !e.shiftKey) {
    const map = { ans: "answer", tell: "tell", "resume-note": "resume" };
    if (map[a.id]) { e.preventDefault(); return doAction(map[a.id]); }
    if (a.id === "sb-note" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); return doAction("sendback-go"); }
  }
  if ((e.key === "Enter" || e.key === " ") && a && a.dataset && a.dataset.tool) { e.preventDefault(); a.click(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { state.q = t.value; renderColBody(); $("#q-end").innerHTML = qEnd(); return; }
  if (t.id && t.id.startsWith("in-")) {
    const w = state.startWf;
    state.startInputs[w] = state.startInputs[w] || {};
    state.startInputs[w][t.id.slice(3)] = t.value;
    updateStart();
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "scope") { state.scope = t.value; store.set("scope", t.value); return render(false); }
  if (t.id === "start-project") { state.startProject = t.value; return updateStart(); }
  if (t.id === "start-confirm") { state.confirm[state.startWf] = t.checked; return updateStart(); }
});
const tip = $("#tip");
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip;
  const b = t.getBoundingClientRect();
  tip.style.left = (b.right + 8) + "px"; tip.style.top = (b.top + b.height / 2 - 12) + "px";
  if (b.right + 8 + tip.offsetWidth > innerWidth) { tip.style.left = (b.left - tip.offsetWidth - 8) + "px"; }
  tip.style.opacity = 1;
});
window.addEventListener("hashchange", route);

/* ------------------------------------------------------------------ start */
applyTheme();
if (!location.hash || location.hash === "#" || location.hash === "#/") history.replaceState(null, "", "#/runs/" + RUNS[0].id);
route();
setInterval(tick, 1600);
</script>
</body>
</html>
