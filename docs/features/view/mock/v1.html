<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sous view mock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%237A3A16' d='M11 5 L14 5 L14 6 L11 6 Z M5 2 L5 7 L2 7 L2 5 Z M11 7 L14 10 L14 12 L11 12 Z M5 15 L2 12 L2 11 L5 11 Z'/%3E%3Cpath fill='%23B5602A' d='M5 2 L11 2 L14 5 L5 5 Z M2 7 L11 7 L11 10 L5 10 Z M11 12 L14 12 L11 15 L5 15 L5 12 Z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #FBF8F2;
  --rail: #EFE9DE;
  --col: #F5F0E7;
  --surface: #FFFFFF;
  --surface-2: #F7F3EC;
  --line: #E6DFD2;
  --line-strong: #D6CDBC;
  --text: #1D1A16;
  --muted: #6B6357;
  --faint: #9A9183;
  --accent: #B5602A;
  --accent-deep: #7A3A16;
  --accent-soft: rgba(181, 96, 42, 0.10);
  --accent-line: rgba(181, 96, 42, 0.38);
  --run: #2E7A68;
  --run-soft: rgba(46, 122, 104, 0.10);
  --fail: #B03A2E;
  --fail-soft: rgba(176, 58, 46, 0.08);
  --done: #5C7A4A;
  --pause: #8A8174;
  --add: rgba(92, 122, 74, 0.14);
  --del: rgba(176, 58, 46, 0.11);
  --sel: rgba(29, 26, 22, 0.065);
  --hover: rgba(29, 26, 22, 0.04);
  --shadow: 0 1px 2px rgba(29, 26, 22, 0.05), 0 4px 16px rgba(29, 26, 22, 0.05);
  --code: #F4EFE6;
  --syn-kw: #7A3A16;
  --syn-str: #4E6E3E;
  --syn-com: #9A9183;
  --syn-fn: #8B4A9C;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16130F; --rail: #100E0B; --col: #1A1713; --surface: #1F1B16; --surface-2: #24201A;
    --line: #2D2821; --line-strong: #3A342B; --text: #F2EBDD; --muted: #A89E8E; --faint: #7A7163;
    --accent: #DB8550; --accent-deep: #9C4F25; --accent-soft: rgba(219, 133, 80, 0.12); --accent-line: rgba(219, 133, 80, 0.42);
    --run: #63BBA5; --run-soft: rgba(99, 187, 165, 0.12); --fail: #E3725F; --fail-soft: rgba(227, 114, 95, 0.10);
    --done: #93B07E; --pause: #8F8678; --add: rgba(147, 176, 126, 0.14); --del: rgba(227, 114, 95, 0.13);
    --sel: rgba(242, 235, 221, 0.08); --hover: rgba(242, 235, 221, 0.045);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
    --code: #1B1813; --syn-kw: #DB8550; --syn-str: #A7C291; --syn-com: #7A7163; --syn-fn: #C9A0D8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16130F; --rail: #100E0B; --col: #1A1713; --surface: #1F1B16; --surface-2: #24201A;
  --line: #2D2821; --line-strong: #3A342B; --text: #F2EBDD; --muted: #A89E8E; --faint: #7A7163;
  --accent: #DB8550; --accent-deep: #9C4F25; --accent-soft: rgba(219, 133, 80, 0.12); --accent-line: rgba(219, 133, 80, 0.42);
  --run: #63BBA5; --run-soft: rgba(99, 187, 165, 0.12); --fail: #E3725F; --fail-soft: rgba(227, 114, 95, 0.10);
  --done: #93B07E; --pause: #8F8678; --add: rgba(147, 176, 126, 0.14); --del: rgba(227, 114, 95, 0.13);
  --sel: rgba(242, 235, 221, 0.08); --hover: rgba(242, 235, 221, 0.045);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  --code: #1B1813; --syn-kw: #DB8550; --syn-str: #A7C291; --syn-com: #7A7163; --syn-fn: #C9A0D8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.mono, code, pre, kbd { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
code { font-size: 0.92em; background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: var(--text); }

.app { display: grid; grid-template-columns: 56px 292px minmax(0, 1fr); height: 100vh; }

/* rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px 0 10px; gap: 4px; }
.rail .brand { width: 32px; height: 32px; display: grid; place-items: center; margin-bottom: 10px; }
.rail .brand svg { width: 22px; height: 22px; }
.rail-btn { position: relative; width: 38px; height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.rail-btn:hover { background: var(--hover); color: var(--text); }
.rail-btn.on { background: var(--sel); color: var(--text); }
.rail-btn.on::before { content: ""; position: absolute; left: -9px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.rail-btn svg { width: 19px; height: 19px; }
.rail-btn .count { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 650; line-height: 15px; text-align: center; }
.rail .spacer { flex: 1; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 3px 8px; border-radius: 5px; white-space: nowrap; opacity: 0; transition: opacity .1s; }
.service { width: 8px; height: 8px; border-radius: 50%; background: var(--run); box-shadow: 0 0 0 3px var(--run-soft); margin: 10px 0 6px; }

/* column */
.col { background: var(--col); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.col-head { padding: 14px 14px 10px; display: flex; align-items: center; gap: 8px; }
.col-head h2 { margin: 0; font-size: 13px; font-weight: 650; flex: 1; letter-spacing: -0.005em; }
.col-head .n { color: var(--faint); font-weight: 500; margin-left: 4px; }
.col-tools { padding: 0 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.col-body { overflow-y: auto; flex: 1; padding: 0 6px 16px; }
.new-entry { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; text-align: left; font-weight: 550; box-shadow: var(--shadow); }
.new-entry:hover { border-color: var(--line-strong); }
.new-entry.on { border-color: var(--accent-line); background: var(--accent-soft); box-shadow: none; }
.new-entry svg { width: 15px; height: 15px; color: var(--accent); }
.new-entry .kbd { margin-left: auto; color: var(--faint); font-size: 11px; font-weight: 450; }
.seg { display: flex; background: var(--hover); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 3px 8px; border-radius: 5px; cursor: pointer; color: var(--muted); font-size: 12px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 550; }
.seg-row { display: flex; align-items: center; gap: 8px; }
.seg-row .lbl { color: var(--faint); font-size: 12px; white-space: nowrap; }
.scope { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); }
.scope select { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 12px; }

.group { margin-top: 10px; }
.group-h { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 11.5px; font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--col); z-index: 1; }
.group-h .n { color: var(--faint); font-weight: 500; }
.group-h .sub { color: var(--faint); font-weight: 450; font-size: 11px; margin-left: auto; }
.item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; min-height: 30px; text-decoration: none; }
.item:hover { background: var(--hover); }
.item.on { background: var(--sel); }
.item .main { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; overflow: hidden; white-space: nowrap; }
.item .name { font-weight: 550; flex-shrink: 0; }
.item .label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.item .side { color: var(--faint); font-size: 11.5px; flex-shrink: 0; }
.item.two .main { flex-direction: column; align-items: stretch; gap: 0; }
.item.two .label { font-size: 12px; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 0 7px; height: 18px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); flex-shrink: 0; }
.badge.fail { background: var(--fail-soft); color: var(--fail); border-color: color-mix(in srgb, var(--fail) 40%, transparent); }
.badge.quiet { background: transparent; color: var(--faint); border-color: var(--line-strong); font-weight: 500; }
.badge.run { background: var(--run-soft); color: var(--run); border-color: color-mix(in srgb, var(--run) 40%, transparent); }
.chip { display: inline-flex; align-items: center; font-size: 11px; padding: 0 6px; height: 18px; border-radius: 4px; background: var(--hover); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* marks */
.mark { width: 14px; height: 14px; flex-shrink: 0; display: inline-block; vertical-align: -2px; }
.spin { animation: spin 1.1s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* main */
.mainpane { overflow-y: auto; min-width: 0; }
.page { max-width: 1180px; margin: 0 auto; padding: 22px 32px 64px; }
.crumbs { color: var(--faint); font-size: 12px; display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.crumbs a { text-decoration: none; color: var(--muted); }
.crumbs a:hover { color: var(--text); }
.head { display: flex; align-items: flex-start; gap: 16px; }
.head h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.3; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.head h1 .sub { color: var(--muted); font-weight: 450; }
.head h1 a { text-decoration: none; }
.head h1 a:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.head .grow { flex: 1; min-width: 0; }
.desc { color: var(--muted); margin: 4px 0 0; }
.actions { display: flex; gap: 6px; flex-shrink: 0; padding-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 550; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { opacity: .9; }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.accent:hover { filter: brightness(1.06); }
.btn.danger { color: var(--fail); }
.btn.danger.arm { background: var(--fail); color: #fff; border-color: var(--fail); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }

.facts { display: flex; flex-wrap: wrap; gap: 0; margin: 16px 0 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.fact { padding: 8px 14px; border-right: 1px solid var(--line); min-width: 0; }
.fact:last-child { border-right: 0; }
.fact .k { font-size: 11px; color: var(--faint); }
.fact .v { font-weight: 550; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.fact .v a { text-decoration: none; }
.fact .v a:hover { text-decoration: underline; }
.fact .v .mono { font-size: 12px; font-weight: 500; }

.state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; }
.state.needs { color: var(--accent); }
.state.running { color: var(--run); }
.state.failed { color: var(--fail); }
.state.paused, .state.stopped { color: var(--muted); }
.state.done { color: var(--done); }

h3 { font-size: 12.5px; font-weight: 650; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
h3 .n { color: var(--faint); font-weight: 500; }
h3 .r { margin-left: auto; font-weight: 450; color: var(--faint); font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card.pad { padding: 14px 16px; }

/* needs-you card */
.ask { margin-top: 18px; border: 1px solid var(--accent-line); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface); border-radius: 12px; padding: 16px 18px; }
.ask.fail { border-color: color-mix(in srgb, var(--fail) 38%, transparent); background: linear-gradient(var(--fail-soft), var(--fail-soft)), var(--surface); }
.ask.quiet { border-color: var(--line); background: var(--surface); }
.ask-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.ask-top .what { font-weight: 650; color: var(--accent); }
.ask.fail .ask-top .what { color: var(--fail); }
.ask.quiet .ask-top .what { color: var(--muted); }
.ask-top .when { margin-left: auto; color: var(--faint); }
.ask-q { font-size: 15px; font-weight: 550; margin: 8px 0 0; line-height: 1.45; }
.ask-detail { margin: 10px 0 0; color: var(--muted); }
.ask-detail ul { margin: 4px 0 0; padding-left: 18px; }
.ask-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.ask-controls .hint { color: var(--faint); font-size: 12px; margin-left: auto; }
.choice { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 550; }
.choice:hover { border-color: var(--accent); color: var(--accent); }
.field { display: flex; gap: 8px; width: 100%; }
.field input, .field textarea, .input { flex: 1; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; outline: none; min-width: 0; }
.field textarea { resize: vertical; min-height: 64px; }
.field input:focus, .field textarea:focus, .input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.shown { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; max-height: 300px; overflow: auto; }
.errbox { margin-top: 12px; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px; white-space: pre-wrap; color: var(--text); max-height: 220px; overflow: auto; }

/* run body */
.runbody { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; margin-top: 24px; align-items: start; }
@media (max-width: 1180px) { .runbody { grid-template-columns: 1fr; } }
.steps { padding: 6px; }
.steps-h, .feed-h { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; font-size: 12px; font-weight: 650; }
.steps-h .r, .feed-h .r { margin-left: auto; font-weight: 450; color: var(--faint); }
.step { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
.step:hover { background: var(--hover); }
.step.on { background: var(--sel); }
.step .lab { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .lab .k { color: var(--faint); font-weight: 450; margin-left: 4px; font-size: 12px; }
.step .num { color: var(--faint); font-size: 11.5px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.step .meta { grid-column: 2 / 4; color: var(--faint); font-size: 11.5px; display: flex; gap: 8px; overflow: hidden; white-space: nowrap; }
.step .meta a { color: var(--muted); text-decoration: none; }
.step .meta a:hover { color: var(--accent); text-decoration: underline; }
.step.pending { opacity: .55; }
.step-group { margin: 4px 0 4px 15px; padding-left: 8px; border-left: 1px solid var(--line); }
.step-group-h { padding: 4px 8px 2px 0; color: var(--faint); font-size: 11.5px; display: flex; gap: 6px; align-items: center; margin-left: -8px; padding-left: 8px; }
.step-group-h a { color: var(--muted); text-decoration: none; font-weight: 550; }
.step-group-h a:hover { text-decoration: underline; }

.feed { display: flex; flex-direction: column; min-height: 420px; }
.feed-h .agentlink { color: var(--muted); font-weight: 450; text-decoration: none; }
.feed-h .agentlink:hover { color: var(--accent); text-decoration: underline; }
.entries { flex: 1; overflow-y: auto; max-height: 560px; padding: 2px 6px 8px; border-top: 1px solid var(--line); }
.entry { display: grid; grid-template-columns: 44px 52px minmax(0, 1fr); gap: 10px; padding: 6px 6px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); align-items: baseline; }
.entry:last-child { border-bottom: 0; }
.entry .t { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.entry .kind { font-size: 10.5px; font-weight: 650; text-transform: lowercase; color: var(--faint); letter-spacing: .02em; }
.entry .body { min-width: 0; overflow-wrap: anywhere; }
.entry.tool .kind { color: var(--muted); }
.entry.tool .body .tn { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 600; }
.entry.tool .body .ta { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--muted); margin-left: 6px; }
.entry.tool .body .tr { color: var(--faint); font-size: 11.5px; margin-left: 8px; }
.entry.tool.open .res { display: block; }
.entry .res { display: none; margin-top: 6px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 11.5px; white-space: pre-wrap; color: var(--muted); }
.entry.tool { cursor: pointer; }
.entry.text .body { color: var(--text); }
.entry.prompt .body { color: var(--muted); white-space: pre-wrap; }
.entry.tell { background: var(--accent-soft); border-radius: 7px; border-bottom-color: transparent; margin: 3px 0; }
.entry.tell .kind, .entry.answer .kind { color: var(--accent); }
.entry.tell .who { font-weight: 600; }
.entry.tell .dl { color: var(--faint); font-size: 11px; margin-left: 6px; }
.entry.answer { background: var(--accent-soft); border-radius: 7px; margin: 3px 0; }
.entry.asks .kind { color: var(--accent); }
.entry.asks .body { font-weight: 550; }
.entry.error .kind, .entry.error .body { color: var(--fail); }
.entry.note .kind { color: var(--muted); }
.entry.note .body { color: var(--muted); font-style: italic; }
.entry.command .body, .entry.output .body { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; white-space: pre-wrap; }
.entry.output .body { color: var(--muted); }
.entry.fresh { animation: fresh 1.2s ease-out; }
@keyframes fresh { from { background: var(--run-soft); } }
.typing { padding: 8px 12px; color: var(--faint); font-size: 12px; display: flex; align-items: center; gap: 8px; }
.dots span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--run); margin-right: 3px; animation: pulse 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
.tellbox { border-top: 1px solid var(--line); padding: 10px; display: flex; gap: 8px; align-items: center; }
.tellbox input { flex: 1; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; }
.tellbox input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tellbox .to { color: var(--faint); font-size: 12px; white-space: nowrap; }
.feed-empty { padding: 28px 16px; color: var(--faint); text-align: center; }
.result { margin-top: 18px; }
.result .card { padding: 12px 16px; }
.result .k { font-size: 11px; color: var(--faint); margin-bottom: 4px; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11px; font-weight: 550; color: var(--faint); padding: 8px 14px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.tbl tr.link { cursor: pointer; }
.tbl tr.link:hover td { background: var(--hover); }
.tbl a { text-decoration: none; font-weight: 550; }

const fmtDur = (ms) => {
  if (ms == null) return "";
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + "m " + String(r).padStart(2, "0") + "s";

};
const fmtAgo = (t) => {

  if (d < D) return Math.round(d / H) + "h ago";

};
const fmtClock = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const fmtDay = (t) => {
  const d = new Date(t), today = new Date();
  if (d.toDateString() === today.toDateString()) return "today " + fmtClock(t);
  const y = new Date(Date.now() - D);
  if (d.toDateString() === y.toDateString()) return "yesterday " + fmtClock(t);

};

WF_TEXT.ticket = `export const meta = {

/* runs */
function act(kind, text, extra) { return Object.assign({ kind, text }, extra || {}); }
function doneActs(label, kind) {
  if (kind === "sh" || kind === "js" || kind === "run") return [act("command", label), act("output", "exit 0")];
  return [act("prompt", "Prompt sent to the agent for " + label + "."), act("tool", "Read", { arg: "README.md", res: "142 lines" }), act("tool", "Grep", { arg: '"' + label + '"', res: "6 matches in 3 files" }), act("text", "Done. The summary is in the step's result.")];
}
function step(label, kind, o) {
  const s = Object.assign({ label, kind, status: "done", dur: 60 * S, tokens: kind === "agent" ? 12000 : 0 }, o || {});
  if (!s.acts) s.acts = s.status === "pending" ? [] : doneActs(s.cmd || label, kind);
  return s;
}

  return r;
}

    case "running": return "running";
    case "paused": return "paused: " + PAUSE_TEXT[r.pause](r)[0];

    case "stopped": return "stopped";

}
const stateClass = (r) => ({ question: "needs", breakpoint: "needs", failed: "failed", running: "running", paused: "paused", done: "done", stopped: "stopped" })[r.state];
const runMark = (r) => mark(r.state === "done" ? "done" : r.state);
function runBadge(r) {

function runTokens(r) { return r.steps.reduce((a, s) => a + (s.tokens || 0), 0) || r.tokens || 0; }

/* agents resolved from a project */
function resolveAgent(name, project) {
  const def = AGENT_DEFS[name];
  const present = FOLDERS.map((f) => {
    const c = def.copies.find((c) => c.at === f.id && (!f.project || c.project === project));
    return { folder: f, copy: c };
  });
  const found = present.filter((p) => p.copy);
  let winner = found[0];
  // in the harness folders of one tier, the default harness (Claude Code) wins
  return { def, present, winner, hidden: found.filter((p) => p !== winner) };
}
function agentHarness(def) {
  if (def.claudeOnly) return "Claude Code";
  if (def.codexOnly) return "Codex";
  return "both";
}
function agentPath(folder, name, project) {
  const base = folder.project ? PROJECT_PATH[project] + "/" : "";
  return base + folder.dir + name + folder.ext;
}
function agentUsers(name) {
  const out = [];
  WORKFLOWS.forEach((w) => walkOutline(w.outline, (n) => { if (n.agent === name) out.push({ wf: w.name, label: n.label }); }));
  return out;
}
function walkOutline(nodes, fn) { nodes.forEach((n) => { fn(n); if (n.children) walkOutline(n.children, fn); }); }
function visibleMcp() { return Object.keys(MCPS).filter((k) => !MCPS[k].project || MCPS[k].project === state.scope); }
function agentField(def, harness, field) {
  const blk = harness === "claude" ? def.claudecode : def.codexcli;
  if (!blk) return null;
  if (blk[field] != null) return { v: blk[field], from: harness === "claude" ? "claudecode" : "codexcli" };
  if (def.top && def.top[field] != null) return { v: def.top[field], from: "top" };
  return null;
}

/* ------------------------------------------------------------------ routing */
function go(hash) { if (location.hash !== "#" + hash) location.hash = hash; else route(); }
function route() {
  const h = decodeURIComponent(location.hash.slice(1));

  const id = rest.join("/");
  const features = ["runs", "workflows", "agents", "skills", "mcp"];
  state.feature = features.includes(feature) ? feature : "runs";
  if (state.feature === "runs") {
    if (id.startsWith("new")) { state.sel.runs = "new"; const q = id.split("?")[1]; const wf = q && new URLSearchParams(q).get("wf"); state.startWf = wf && WF[wf] ? wf : state.startWf; }
    else if (id && runById(id)) state.sel.runs = id;
    else if (!state.sel.runs || (state.sel.runs !== "new" && !runById(state.sel.runs))) state.sel.runs = sortedRuns()[0].id;
  } else if (id) {
    state.sel[state.feature] = id;

  state.sendBack = false; state.resumeNote = false;

}

  const order = { needs: 0, running: 1, paused: 2, done: 3 };

/* code + diff */
function highlight(line) {
  const re = /(\/\/.*$)|(`(?:\\.|[^`])*`?|"(?:\\.|[^"])*"|'(?:\\.|[^'])*')|\b(export|const|await|return|async|for|of|if|let|break|true|false)\b|\b(agent|sh|js|py|run|ask|breakpoint|workflow|parallel|pipeline|gate|choose|log)(?=\()/g;
  let out = "", last = 0, m;
  while ((m = re.exec(line))) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? "syn-com" : m[2] ? "syn-str" : m[3] ? "syn-kw" : "syn-fn";
    out += '<span class="' + cls + '">' + esc(m[0]) + "</span>";
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  return out + esc(line.slice(last));
}
function codeBlock(text, path, plain) {
  const lines = text.replace(/\n$/, "").split("\n");
  return '<div class="codeblock mono">' + (path ? '<div class="path"><span>' + esc(path) + "</span><span>" + lines.length + " lines</span></div>" : "") + '<div class="inner">' +
    lines.map((l, i) => '<div class="ln"><span class="no">' + (i + 1) + '</span><span class="tx">' + (plain ? esc(l) : highlight(l)) + "</span></div>").join("") + "</div></div>";
}
function diffOps(a, b) {
  const A = a.replace(/\n$/, "").split("\n"), B = b.replace(/\n$/, "").split("\n");
  const n = A.length, m = B.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { ops.push([" ", A[i], j + 1]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(["-", A[i], null]); i++; }
    else { ops.push(["+", B[j], j + 1]); j++; }
  }
  while (i < n) ops.push(["-", A[i++], null]);
  while (j < m) { ops.push(["+", B[j], j + 1]); j++; }
  return ops;
}
function diffCount(w) { return diffOps(w.approvedText, w.text).filter((o) => o[0] !== " ").length; }
function diffBlock(a, b, path) {
  const ops = diffOps(a, b);
  const keep = ops.map(() => false);
  ops.forEach((o, i) => { if (o[0] !== " ") for (let k = Math.max(0, i - 3); k <= Math.min(ops.length - 1, i + 3); k++) keep[k] = true; });
  let out = "", skipped = 0;
  const adds = ops.filter((o) => o[0] === "+").length, dels = ops.filter((o) => o[0] === "-").length;
  ops.forEach((o, i) => {
    if (!keep[i]) { skipped++; return; }
    if (skipped) { out += '<div class="ln gap"><span class="no"></span><span class="tx">' + skipped + " matching lines</span></div>"; skipped = 0; }
    const cls = o[0] === "+" ? " add" : o[0] === "-" ? " del" : "";
    out += '<div class="ln' + cls + '"><span class="no">' + (o[2] || "") + '</span><span class="tx">' + esc(o[0]) + " " + highlight(o[1]) + "</span></div>";
  });
  if (skipped) out += '<div class="ln gap"><span class="no"></span><span class="tx">' + skipped + " matching lines</span></div>";
  return '<div class="codeblock mono"><div class="path"><span>' + esc(path) + '</span><span><span style="color:var(--done)">+' + adds + '</span>  <span style="color:var(--fail)">-' + dels + "</span></span></div><div class=\"inner\">" + out + "</div></div>";
}
function md(text) {
  const lines = text.split("\n");
  let out = "", inList = false;
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  lines.forEach((l) => {
    if (/^\s*[-*] /.test(l) || /^\d+\. /.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(l.replace(/^\s*([-*]|\d+\.) /, "")) + "</li>"; return; }
    if (inList) { out += "</ul>"; inList = false; }
    if (/^#{1,3} /.test(l)) out += "<h2>" + inline(l.replace(/^#+ /, "")) + "</h2>";
    else if (l.trim()) out += "<p>" + inline(l) + "</p>";
  });
  if (inList) out += "</ul>";
  return out;
}

  if (!users.length) html += '<p class="faint">No workflow step names this agent.</p>';
  else html += '<div class="card"><table class="tbl"><tr><th>Workflow</th><th>Step</th></tr>' + users.map((u) => '<tr class="link" data-href="#workflows/' + u.wf + '"><td><a href="#workflows/' + u.wf + '">' + esc(u.wf) + '</a></td><td class="muted">' + esc(u.label) + "</td></tr>").join("") + "</table></div>";

  html += '<h3>File</h3>' + codeBlock(agentFileText(name, def, def.codexOnly ? "codex" : null), agentPath(w.folder, name, state.scope), true);

}
function harnessCard(def, h) {
  const title = h === "claude" ? "Claude Code" : "Codex";
  const blockName = h === "claude" ? "claudecode" : "codexcli";
  const isDefault = (h === "claude" && (def.claudeOnly || (!def.codexOnly && def.harness !== "codex"))) || (h === "codex" && (def.codexOnly || def.harness === "codex"));
  let c = '<div class="card"><div class="harness-h">' + title + (isDefault ? ' <span class="chip">default</span>' : "") + '<span class="r mono">' + (def.claudeOnly || def.codexOnly ? "" : blockName) + "</span></div>";
  if ((h === "codex" && def.claudeOnly) || (h === "claude" && def.codexOnly)) {
    return c + '<div class="empty-h">This agent lives in ' + (def.claudeOnly ? "Claude Code's" : "Codex's") + " own folder, so it runs only on " + (def.claudeOnly ? "Claude Code" : "Codex") + ". A step that sends it to " + title + " makes the workflow invalid. Move it to <code>.rulesync/subagents</code> to run it on both.</div></div>";
  }
  const row = (k, field, fmt) => {
    const f = agentField(def, h, field);
    let v = f ? fmt(f.v) : '<span class="faint">' + (field === "model" ? "the run's model" : "none") + "</span>";
    if (h === "codex" && field === "tools") v = f ? fmt(f.v) + (f.from === "top" ? '<span class="from">from the top</span>' : "") + '<div class="faint" style="font-size:11.5px">Codex has no allow list. sous declines the approvals the list doesn\'t cover.</div>' : '<span class="faint">every tool</span>';
    if (h === "codex" && field === "skills") v = '<span class="faint">Codex has no skills list. It sees every skill in its folders.</span>';
    if (h === "claude" && field === "tools" && !f) v = '<span class="faint">every tool</span>';
    return '<div class="k">' + k + '</div><div class="v">' + v + (f && f.from === "top" && !(h === "codex" && (field === "skills" || field === "tools")) ? '<span class="from">from the top</span>' : "") + "</div>";
  };
  const list = (arr) => arr.join(", ");
  const links = (kind) => (arr) => arr.map((x) => (kind === "skills" ? (SKILLS[x] ? '<a href="#skills/' + x + '">' + x + "</a>" : x) : MCPS[x] ? '<a href="#mcp/' + x + '">' + x + "</a>" : '<span style="color:var(--fail)" title="No MCP server with this name">' + x + " (missing)</span>")).join(", ");
  c += '<div class="kv">' + row("Model", "model", (v) => '<span class="mono">' + esc(v) + "</span>") + row("Effort", "effort", esc) + row("Tools", "tools", list) + row("Skills", "skills", links("skills")) + row("MCP servers", "mcpServers", links("mcp")) + "</div></div>";
  return c;
}

/* ------------------------------------------------------------------ actions */
let toastTimer;
function toast(msg, cmd) {
  const t = $("#toast");
  t.innerHTML = "<span>" + esc(msg) + "</span>" + (cmd ? '<span class="mono">' + esc(cmd) + "</span>" : "");
  t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4200);
}
function currentRun() { return state.feature === "runs" ? runById(state.sel.runs) : null; }
function startNext(r) {
  const next = r.steps.find((s) => s.status === "pending");
  if (!next) { r.state = "done"; r.endedAt = Date.now(); r.result = r.result || "Every step finished."; return; }
  if (next.kind === "ask") {
    next.status = "waiting"; next.acts.push(act("asks", "Go on with the next step?", { at: Date.now() }));
    r.state = "question"; r.waiting = { kind: "question", id: "q-" + Math.random().toString(16).slice(2, 6), step: next.label, at: Date.now(), input: "select", text: "Go on with the next step?", choices: ["Yes", "No"] };
    return;
  }
  next.status = "running"; next.startedAt = Date.now(); next.dur = 0; next.tokens = next.kind === "agent" ? 0 : null;
  next.ticksLeft = next.kind === "agent" ? 8 : 2; next.live = next.live || "generic"; next.poolI = 0;
  next.acts = [next.kind === "agent" ? act("prompt", "Prompt for " + next.label + ".", { at: Date.now() }) : act("command", next.cmd || next.label, { at: Date.now() })];
  delete state.stepSel[r.id];
}
function finishStep(r, s) {
  s.status = "done"; s.dur = Date.now() - s.startedAt;
  if (s.kind !== "agent") s.acts.push(act("output", "exit 0", { at: Date.now() }));
  else s.acts.push(act("text", "Done.", { at: Date.now() }));
  if (s.bp) {
    s.status = "waiting";
    r.state = "breakpoint";
    r.waiting = { kind: "breakpoint", id: "q-" + Math.random().toString(16).slice(2, 6), step: s.label, at: Date.now(), title: s.bp, tries: 1, max: 5, show: "The step finished. Its result:\n\n- " + s.label + " is done.\n- Nothing failed." };
    return;
  }
  if (!r.steps.some((x) => x.status === "running")) startNext(r);
}
function doAction(a, el) {
  const r = currentRun();
  switch (a) {
    case "answer": case "answer-text": {
      const val = a === "answer" ? el.dataset.val : ($("#answer-text").value || "").trim();
      if (!val) { $("#answer-text").focus(); return; }
      const w = r.waiting, s = r.steps.find((x) => x.label === w.step && x.status === "waiting");
      s.acts.push(act("answer", val, { at: Date.now() }));
      if (s.kind === "ask") { s.status = "done"; r.state = "running"; r.waiting = null; startNext(r); }
      else { s.status = "running"; s.startedAt = Date.now() - (s.dur || 0); s.ticksLeft = 10; s.live = "generic"; s.poolI = 0; r.state = "running"; r.waiting = null; }
      toast("Answered.", "sous answer " + w.id + ' "' + val + '"');
      break;
    }
    case "approve": {
      const w = r.waiting, s = r.steps.find((x) => x.label === w.step);
      s.status = "done"; s.acts.push(act("answer", "Approved", { at: Date.now() }));
      r.state = "running"; r.waiting = null; startNext(r);
      toast("Approved.", "sous approve " + w.id);
      break;
    }
    case "sendback": state.sendBack = true; renderMain(); setTimeout(() => $("#sendback-note") && $("#sendback-note").focus()); return;
    case "sendback-cancel": state.sendBack = false; renderMain(); return;
    case "sendback-go": {
      const note = ($("#sendback-note").value || "").trim();
      if (!note) { $("#sendback-note").focus(); return; }
      const w = r.waiting, s = r.steps.find((x) => x.label === w.step);
      s.acts.push(act("answer", "Sent back: " + note, { at: Date.now() }));
      s.status = "running"; s.startedAt = Date.now(); s.ticksLeft = 8; s.live = "generic"; s.poolI = 0; s.call = (s.call || 1) + 1;
      s.acts.push(act("note", "The step runs again with your note. Try 2 of 5.", { at: Date.now() }));
      r.state = "running"; r.waiting = null; state.sendBack = false;
      toast("Sent back with your note.", "sous send-back " + w.id + ' "' + note + '"');
      break;
    }
    case "stop": {
      if (!el.classList.contains("arm")) { el.classList.add("arm"); el.lastChild.textContent = "Click again to stop"; setTimeout(() => { if (el.isConnected) { el.classList.remove("arm"); el.lastChild.textContent = el.closest(".ask") ? "Stop the run" : "Stop"; } }, 3000); return; }
      r.steps.forEach((s) => { if (s.status === "running" || s.status === "waiting" || s.status === "paused") s.status = "stopped"; if (s.status === "pending") s.status = "skipped"; });
      r.state = "stopped"; r.endedAt = Date.now(); r.waiting = null; r.result = "You stopped it from the view." + (WF[r.wf].place === "worktree" ? " Its worktree stays for review." : "");
      toast("Stopped.", "sous stop " + r.id);
      break;
    }
    case "pause": {
      r.steps.forEach((s) => { if (s.status === "running") { s.status = "done"; s.dur = Date.now() - s.startedAt; } });
      r.state = "paused"; r.pause = "requested"; r.lastAt = Date.now();
      toast("Paused. The running steps finish first.", "sous pause " + r.id);
      break;
    }
    case "resume": case "resumenote-go": {
      let note = "", stepName = "";
      if (a === "resumenote-go") { note = ($("#resume-note").value || "").trim(); stepName = $("#resume-step").value; if (!note) { $("#resume-note").focus(); return; } }
      const s = r.steps.find((x) => x.status === "failed" || x.status === "paused");
      if (s) { s.status = "running"; s.startedAt = Date.now(); s.ticksLeft = s.kind === "agent" ? 8 : 3; s.live = s.live || "generic"; s.poolI = 0; s.acts.push(act("note", note ? "Resumed with your note: " + note : "Resumed.", { at: Date.now() })); }
      else startNext(r);
      if (note && stepName) { const t = r.steps.find((x) => x.label === stepName); if (t && t !== s) t.acts.push(act("note", "Your note waits for this step: " + note, { at: Date.now() })); }
      r.state = "running"; r.failure = null; r.endedAt = null; r.pause = null; state.resumeNote = false;
      toast("Resumed.", "sous resume " + r.id + (note ? ' --note "' + note + '"' + (stepName ? ' --step "' + stepName + '"' : "") : ""));
      break;
    }
    case "resumenote": state.resumeNote = true; renderMain(); setTimeout(() => $("#resume-note") && $("#resume-note").focus()); return;
    case "resumenote-cancel": state.resumeNote = false; renderMain(); return;
    case "tell-focus": { const i = $("#tell-input"); if (i) { i.scrollIntoView({ block: "center", behavior: "smooth" }); i.focus(); } else toast("Pick a running agent step to tell it something."); return; }
    case "tell": {
      const i = $("#tell-input"), msg = (i.value || "").trim();
      if (!msg) { i.focus(); return; }
      const s = defaultStep(r);
      const e = act("tell", msg, { at: Date.now(), delivery: "pending" });
      s.acts.push(e);
      i.value = "";
      appendEntries(r, s);
      setTimeout(() => { e.delivery = "delivered"; const last = $$('.entries[data-feed="' + r.id + ":" + s.i + '"] .entry.tell [data-delivery]').pop(); if (last) last.textContent = "delivered"; }, 1300);
      setTimeout(() => { if (s.status === "running") { s.acts.push(act("text", "Noted. I'll do that next.", { at: Date.now() })); appendEntries(r, s); } }, 3200);
      toast("Told " + s.label + ".", "sous tell " + r.id + ' --step "' + s.label + '" "' + msg + '"');
      return;
    }
    case "rerun": {
      const w = WF[r.wf];
      state.startWf = w.name; state.startProject = r.project;
      go("runs/new?wf=" + w.name);
      setTimeout(() => { Object.entries(r.inputs || {}).forEach(([k, v]) => { const f = $('[data-input="' + k + '"]'); if (f) f.value = v; }); updateStart(); });
      return;
    }
    case "wf-file": state.wfTab[state.sel.workflows] = "file"; renderMain(); return;
    case "wf-start": state.startWf = state.sel.workflows; const ww = WF[state.startWf]; state.startProject = ww.where === "home" ? null : ww.where; go("runs/new?wf=" + state.startWf); return;
    case "start": {
      const w = WF[state.startWf];
      const inputs = {};
      $$("[data-input]").forEach((f) => { inputs[f.dataset.input] = f.value.trim(); });
      const label = String(inputs[w.inputs[0].name] || w.inputs[0].def || w.name);
      const t = Date.now();
      const steps = [];
      const flat = (nodes, bp) => nodes.forEach((n) => {
        if (n.kind === "breakpoint") return flat(n.children, n.label);
        if (n.children) return flat(n.children);
        steps.push(step(n.label.replace("<name>", "react"), n.kind === "loop" ? "agent" : n.kind, { agent: n.agent, wf: n.wf, cmd: n.cmd, status: "pending", dur: null, tokens: null, bp }));
      });
      flat(w.outline);
      const wasChanged = !!w.approved.changedSince;
      const r2 = addRun({ id: runId(t), wf: w.name, project: state.startProject, label: label.length > 48 ? label.slice(0, 46) + "..." : label, inputs, state: "running", startedBy: "you, from the view", startedAt: t, tokens: 0, model: "claude/opus", steps });
      startNext(r2);
      if (w.approved.changedSince) { w.approved = { at: t, by: "you" }; w.approvedText = w.text; }
      toast(wasChanged ? "Approved and started." : "Started.", startCmd().replace(/<\/?b>/g, ""));
      go("runs/" + r2.id);
      return;
    }
  }
  render();
}

function appendEntries(r, s) {
  const box = $('.entries[data-feed="' + r.id + ":" + s.i + '"]');
  if (!box) return;
  const have = box.querySelectorAll(".entry").length;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  if (have === 0) box.innerHTML = "";
  s.acts.slice(have).forEach((e) => box.insertAdjacentHTML("beforeend", renderEntry(e, true)));
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* ------------------------------------------------------------------ live tick */
let tickN = 0;
function tick() {
  tickN++;
  let changed = false;
  RUNS.forEach((r) => {
    if (r.state !== "running") return;
    r.steps.forEach((s) => {
      if (s.status !== "running") return;
      if (s.kind === "agent") {
        s.tokens = (s.tokens || 0) + 180 + Math.floor(Math.random() * 900);
        if (Math.random() < 0.55) {
          const pool = POOLS[s.live] || POOLS.generic;
          s.poolI = s.poolI || 0;
          const p = pool[s.poolI % pool.length]; s.poolI++;
          s.acts.push(p[0] === "tool" ? act("tool", p[1], { arg: p[2], res: p[3], at: Date.now() }) : act("text", p[1], { at: Date.now() }));
          appendEntries(r, s);
        }
      }
      s.ticksLeft--;
      if (s.ticksLeft <= 0) { finishStep(r, s); changed = true; }
    });
  });
  if (changed) {
    renderCol(); renderRail();
    const r = currentRun();
    if (r && !document.activeElement.matches("input, textarea")) renderMain();
  }
  updateLive();
}
function updateLive() {
  $$("[data-live]").forEach((el) => {
    const r = runById(el.dataset.run); if (!r) return;
    const k = el.dataset.live;
    if (k === "elapsed") el.textContent = fmtDur(runElapsed(r));
    else if (k === "tokens") el.textContent = fmtTok(runTokens(r));
    else if (k === "stepdur") el.textContent = fmtDur(stepDur(r.steps[+el.dataset.step]));
    else if (k === "steptok") el.textContent = fmtTok(r.steps[+el.dataset.step].tokens);
  });
}

/* ------------------------------------------------------------------ events */
function applyTheme() {
  if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
}
document.addEventListener("click", (ev) => {
  const t = ev.target;
  const goEl = t.closest("[data-go]");
  if (goEl) { const f = goEl.dataset.go; if (f.includes("/")) go(f); else { const s = state.sel[f]; go(f + (s ? "/" + s : "")); } return; }
  if (t.closest("#theme")) { state.theme = { auto: "light", light: "dark", dark: "auto" }[state.theme]; store.set("theme", state.theme); applyTheme(); renderRail(); return; }
  const grp = t.closest("[data-group]");
  if (grp) { state.groupBy = grp.dataset.group; store.set("groupBy", state.groupBy); renderCol(); return; }
  const actEl = t.closest("[data-act]");
  if (actEl) { ev.preventDefault(); doAction(actEl.dataset.act, actEl); return; }
  const stepEl = t.closest(".step[data-step]");
  if (stepEl && !t.closest("a")) { state.stepSel[state.sel.runs] = +stepEl.dataset.step; renderMain(); return; }
  const tool = t.closest(".entry[data-toggle]");
  if (tool) { tool.classList.toggle("open"); return; }
  const tab = t.closest("[data-wftab]");
  if (tab) { state.wfTab[state.sel.workflows] = tab.dataset.wftab; renderMain(); return; }
  const sw = t.closest("[data-startwf]");
  if (sw) { state.startWf = sw.dataset.startwf; history.replaceState(null, "", "#runs/new?wf=" + state.startWf); renderMain(); updateStart(); return; }
  const pk = t.closest("[data-peek]");
  if (pk) { ev.preventDefault(); state.peek[pk.dataset.peek] = !state.peek[pk.dataset.peek]; renderMain(); return; }
  const row = t.closest("tr[data-href]");
  if (row && !t.closest("a")) { location.hash = row.dataset.href.slice(1); return; }
});
document.addEventListener("input", (ev) => {
  if (ev.target.closest("#startform") || ev.target.id === "start-confirm") updateStart();
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "scope") { state.scope = ev.target.value; store.set("scope", state.scope); render(); }
  if (ev.target.id === "start-project") { state.startProject = ev.target.value; updateStart(); }
  if (ev.target.id === "start-confirm") updateStart();
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" || ev.shiftKey) return;
  if (ev.target.id === "tell-input") { ev.preventDefault(); doAction("tell"); }
  if (ev.target.id === "answer-text") { ev.preventDefault(); doAction("answer-text"); }
});
// rail tooltips
document.addEventListener("mouseover", (ev) => {
  const el = ev.target.closest("[data-tip]"), tip = $("#tip");
  if (!el) { tip.style.opacity = 0; return; }
  const b = el.getBoundingClientRect();
  tip.textContent = el.dataset.tip;
  tip.style.left = b.right + 10 + "px"; tip.style.top = b.top + b.height / 2 - 11 + "px"; tip.style.opacity = 1;
});
window.addEventListener("hashchange", route);

applyTheme();
route();
setInterval(tick, 2200);
setInterval(() => { if (state.feature === "runs") $$(".col .side").forEach(() => {}); }, 60000);
</script>
</body>
</html>
