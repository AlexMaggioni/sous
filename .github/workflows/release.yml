name: Release

# Pushing a tag such as v0.2.0, made by `pnpm release 0.2.0`, publishes that version: the npm
# packages and the GitHub release.
#
# Secrets:
#   NPM_TOKEN  an npm automation token that can publish to the @sous scope
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag against the packages
        id: version
        run: |
          version=$(node scripts/release.mjs check "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: pnpm test
      - name: Publish to npm
        # pnpm publishes harnesses, engine and cli, skips the private view, and skips a version
        # already on the registry, so a rerun of this job is safe.
        run: pnpm -r publish --access public --no-git-checks --tag "${{ steps.version.outputs.prerelease == 'true' && 'next' || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: GitHub release
        run: |
          node scripts/release.mjs notes "${{ steps.version.outputs.version }}" > notes.md
          flags=()
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --title "sous ${{ steps.version.outputs.version }}" --notes-file notes.md "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

