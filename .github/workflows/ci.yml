name: CI

# Runs on pull requests and by hand only, to save Actions minutes on a private repo.
on:
  pull_request:
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r --filter '!@automatalabs/codex-acp' test
